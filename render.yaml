services:
  - type: web
    name: ai-couple-face-swapper
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/antigravity_master_backend.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false

